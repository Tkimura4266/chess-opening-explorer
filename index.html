<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Opening Explorer</title>
<meta name="description" content="自分の対局から作った白番/黒番のオープニングツリーを、盤面を動かしながら辿れるエクスプローラー。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>My Opening Explorer</h1>
  <p id="subtitle" class="muted"></p>
  <div class="color-toggle">
    <button id="btn-white" class="toggle-btn active">白番</button>
    <button id="btn-black" class="toggle-btn">黒番</button>
  </div>
</header>

<main>
  <section class="board-pane">
    <div id="board" class="board"></div>
    <div class="board-controls">
      <button id="btn-reset">最初に戻る</button>
      <span id="hint" class="hint"></span>
    </div>
    <nav id="breadcrumb" class="breadcrumb"></nav>
  </section>

  <section class="info-pane">
    <h2 id="opening-name">&nbsp;</h2>
    <p id="node-stats" class="muted"></p>
    <p class="lichess-link"><a id="lichess-link" href="#" target="_blank" rel="noopener">この局面をLichessで見る</a></p>

    <h3>この局面からの手</h3>
    <div id="move-list" class="move-list"></div>

    <h3>参考対局</h3>
    <ul id="sample-games" class="sample-games"></ul>
  </section>
</main>

<footer>
  <span id="generated-at"></span>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script src="app.js"></script>
</body>
</html>
